<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showtime</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0b0f14;
      color:#f4f7fa;
      width:100%;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Space Grotesk',sans-serif;
      position:relative;
    }

    /* soft ambient gradients */

    .bg-glow{
      position:absolute;
      width:700px;
      height:700px;
      border-radius:50%;
      background:radial-gradient(circle,
      rgba(255,255,255,0.06) 0%,
      rgba(255,255,255,0.02) 35%,
      transparent 70%);
      filter:blur(10px);
      animation:pulse 8s ease-in-out infinite;
    }

    /* cinematic scan lines */

    .scan{
      position:absolute;
      width:100%;
      height:100%;
      background:
              repeating-linear-gradient(
                      to bottom,
                      rgba(255,255,255,0.015),
                      rgba(255,255,255,0.015) 1px,
                      transparent 2px,
                      transparent 4px
              );
      opacity:0.25;
    }

    /* opening bars */

    .bar{
      position:absolute;
      height:1px;
      width:0;
      background:rgba(255,255,255,0.15);
      animation:openBar 2s cubic-bezier(.19,1,.22,1) forwards;
    }

    .top{
      top:18%;
    }

    .bottom{
      bottom:18%;
    }

    .container{
      position:relative;
      z-index:5;
      text-align:center;
    }

    /* loading indicator */

    .loader{
      font-family:'IBM Plex Mono', monospace;
      font-size:12px;
      letter-spacing:0.3em;
      color:rgba(255,255,255,0.35);
      margin-bottom:28px;
      opacity:0;
      animation:fadeUp 1s ease forwards .5s;
    }

    /* main text */

    .text{
      font-size:clamp(22px,4vw,46px);
      text-transform:uppercase;
      font-weight:500;
      letter-spacing:0.18em;

      opacity:0;
      transform:translateY(30px);

      animation:reveal 1.8s cubic-bezier(.16,1,.3,1) forwards 1s;

      text-shadow:
              0 0 20px rgba(255,255,255,0.05);
    }

    /* elegant emphasis */

    .text span{
      font-weight:700;
      color:#ffffff;
    }

    /* blinking cursor */

    .cursor{
      display:inline-block;
      width:10px;
      margin-left:8px;
      animation:blink 1s infinite;
    }

    /* subtle footer */

    .footer{
      margin-top:26px;
      font-family:'IBM Plex Mono', monospace;
      font-size:11px;
      letter-spacing:0.35em;
      color:rgba(255,255,255,0.28);

      opacity:0;
      animation:fadeUp 2s ease forwards 2.2s;
    }

    /* animations */

    @keyframes reveal{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeUp{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes blink{
      50%{
        opacity:0;
      }
    }

    @keyframes openBar{
      to{
        width:78%;
      }
    }

    @keyframes pulse{
      0%,100%{
        transform:scale(1);
        opacity:0.7;
      }

      50%{
        transform:scale(1.08);
        opacity:1;
      }
    }

  </style>
</head>

<body>

<div class="bg-glow"></div>
<div class="scan"></div>

<div class="bar top"></div>
<div class="bar bottom"></div>

<div class="container">

  <div class="loader">
    SYSTEM INITIALIZING
  </div>

  <div class="text">
    UNTIL THE SHOW <span>BEGINS...</span><span class="cursor">|</span>
  </div>

  <div class="footer">
    STAY TUNED
  </div>

</div>

</body>
</html>
