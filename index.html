<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showtime</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      background:#0f1115;
      font-family:'Inter',sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#f5f5f5;
    }

    /* background glow */
    body::before{
      content:"";
      position:absolute;
      width:600px;
      height:600px;
      background:radial-gradient(circle, rgba(255,255,255,0.06), transparent 65%);
      animation:pulse 6s ease-in-out infinite;
    }

    /* cinematic opening lines */
    .line{
      position:absolute;
      width:0%;
      height:1px;
      background:rgba(255,255,255,0.12);
      animation:expand 2s ease forwards;
    }

    .top{
      top:20%;
    }

    .bottom{
      bottom:20%;
    }

    .container{
      position:relative;
      text-align:center;
      z-index:2;
      padding:40px;
    }

    /* subtle loading dot */
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#cfcfcf;
      margin:0 auto 28px;
      opacity:0;
      animation:fadeIn 1s ease forwards 1.2s,
      blink 1.8s infinite 2.2s;
    }

    .text{
      font-size:clamp(28px,5vw,52px);
      font-weight:300;
      letter-spacing:0.08em;
      opacity:0;
      transform:translateY(25px);
      animation:reveal 1.6s cubic-bezier(.16,1,.3,1) forwards 1s;
    }

    .text span{
      font-weight:600;
      color:#ffffff;
    }

    /* subtle tech subtitle */
    .sub{
      margin-top:18px;
      font-size:13px;
      letter-spacing:0.25em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      opacity:0;
      animation:fadeIn 2s ease forwards 2.2s;
    }

    @keyframes reveal{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes expand{
      to{
        width:80%;
      }
    }

    @keyframes fadeIn{
      to{
        opacity:1;
      }
    }

    @keyframes blink{
      0%,100%{
        opacity:0.2;
      }
      50%{
        opacity:1;
      }
    }

    @keyframes pulse{
      0%,100%{
        transform:scale(1);
        opacity:0.5;
      }
      50%{
        transform:scale(1.08);
        opacity:0.8;
      }
    }
  </style>
</head>

<body>

<div class="line top"></div>
<div class="line bottom"></div>

<div class="container">
  <div class="dot"></div>

  <div class="text">
    Wait till <span>showtime...</span>
  </div>

  <div class="sub">
    initializing experience
  </div>
</div>

</body>
</html>
